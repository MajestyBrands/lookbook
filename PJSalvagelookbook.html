<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PJ Salvage Lookbook</title>

  <!-- PageFlip CSS -->
  <link rel="stylesheet" href="https://unpkg.com/page-flip/dist/css/page-flip.css" />

  <style>
    body {
      margin: 0;
      background: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #flipbook {
      width: 95vw;
      height: 95vh;
    }

    /* Optional luxury feel */
    .stf__parent {
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div id="flipbook"></div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- PageFlip -->
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<script>
  // 👇 THIS MUST MATCH YOUR FILE NAME EXACTLY
  const pdfUrl = "PJSalvage.pdf";

  const container = document.getElementById("flipbook");

  const pageFlip = new St.PageFlip(container, {
    width: 600,
    height: 800,
    size: "stretch",
    autoSize: true,
    maxWidth: 1200,
    maxHeight: 1600,
    minWidth: 315,
    minHeight: 400,
    showCover: true,
    mobileScrollSupport: false,
  });

  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
    const pages = [];

    for (let i = 1; i <= pdf.numPages; i++) {
      pages.push(
        pdf.getPage(i).then(page => {
          const viewport = page.getViewport({ scale: 2 });

          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          canvas.width = viewport.width;
          canvas.height = viewport.height;

          return page.render({
            canvasContext: context,
            viewport: viewport
          }).promise.then(() => {
            const img = document.createElement("img");
            img.src = canvas.toDataURL("image/jpeg", 1.0);
            return img;
          });
        })
      );
    }

    Promise.all(pages).then(images => {
      pageFlip.loadFromImages(images.map(img => img.src));
    });
  });
</script>

</body>
</html>
